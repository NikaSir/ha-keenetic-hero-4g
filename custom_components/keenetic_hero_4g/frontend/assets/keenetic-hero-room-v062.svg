<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="Светлая комната для фонового слоя Keenetic">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf7"/>
      <stop offset="0.55" stop-color="#f3eee7"/>
      <stop offset="1" stop-color="#e9e1d8"/>
    </linearGradient>
    <linearGradient id="windowSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dff3ff"/>
      <stop offset="1" stop-color="#f8fcff"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dcbf98"/>
      <stop offset="0.45" stop-color="#e8cfad"/>
      <stop offset="1" stop-color="#d6b488"/>
    </linearGradient>
    <linearGradient id="rug" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3efe9"/>
      <stop offset="1" stop-color="#e8e0d7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#7c654d" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <rect width="1000" height="520" fill="url(#wall)"/>

  <!-- Window and curtains -->
  <rect x="72" y="34" width="360" height="244" rx="10" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="88" y="49" width="328" height="212" rx="5" fill="url(#windowSky)"/>
  <path d="M88 198 C165 172 242 185 328 156 C365 143 390 140 416 142 L416 261 L88 261 Z" fill="#cfe3cf" opacity="0.62"/>
  <line x1="252" y1="49" x2="252" y2="261" stroke="#ffffff" stroke-width="9"/>
  <line x1="88" y1="154" x2="416" y2="154" stroke="#ffffff" stroke-width="9"/>
  <path d="M42 22 C92 63 106 205 73 321 L20 321 L20 22 Z" fill="#fffdf9" opacity="0.92"/>
  <path d="M438 20 C407 69 399 196 431 319 L485 319 L485 20 Z" fill="#fffdf9" opacity="0.88"/>

  <!-- Left plant -->
  <g filter="url(#soft)">
    <ellipse cx="135" cy="320" rx="58" ry="16" fill="#a99176" opacity="0.16"/>
    <path d="M125 300 C122 257 115 219 102 183" stroke="#608258" stroke-width="6" fill="none"/>
    <path d="M132 298 C139 251 148 213 164 177" stroke="#608258" stroke-width="6" fill="none"/>
    <path d="M126 242 C86 240 79 207 103 201 C128 194 144 216 126 242Z" fill="#7ba86f"/>
    <path d="M140 228 C165 194 193 205 191 228 C189 249 159 257 140 228Z" fill="#6e9d64"/>
    <path d="M110 201 C80 185 87 157 109 157 C133 159 143 184 110 201Z" fill="#88b57b"/>
    <path d="M158 196 C173 160 201 166 207 188 C210 208 184 221 158 196Z" fill="#79a86d"/>
    <rect x="98" y="287" width="75" height="66" rx="11" fill="#e6ddd1"/>
  </g>

  <!-- Right shelf / decor -->
  <g filter="url(#shadow)">
    <rect x="754" y="64" width="184" height="244" rx="12" fill="#f7f3ed"/>
    <rect x="772" y="84" width="148" height="11" rx="5" fill="#d8c8b8"/>
    <rect x="772" y="157" width="148" height="11" rx="5" fill="#d8c8b8"/>
    <rect x="772" y="230" width="148" height="11" rx="5" fill="#d8c8b8"/>
    <rect x="791" y="101" width="40" height="50" rx="4" fill="#d6e0e5"/>
    <rect x="839" y="105" width="10" height="46" rx="2" fill="#7695a7"/>
    <rect x="854" y="97" width="13" height="54" rx="2" fill="#b68f6d"/>
    <rect x="871" y="111" width="11" height="40" rx="2" fill="#6f7d76"/>
    <rect x="886" y="103" width="12" height="48" rx="2" fill="#b6a087"/>
    <rect x="789" y="177" width="54" height="38" rx="5" fill="#e8e1d9"/>
    <circle cx="874" cy="194" r="19" fill="#d3e1cc"/>
    <rect x="861" y="207" width="26" height="17" rx="5" fill="#d9c7b7"/>
    <rect x="793" y="253" width="93" height="36" rx="5" fill="#efe6dd"/>
  </g>

  <!-- Picture -->
  <g filter="url(#shadow)">
    <rect x="600" y="78" width="104" height="82" rx="7" fill="#ffffff"/>
    <rect x="612" y="90" width="80" height="58" rx="3" fill="#d8e1e4"/>
    <path d="M612 132 L640 113 L658 125 L676 104 L692 116 L692 148 L612 148Z" fill="#96a7a5" opacity="0.7"/>
  </g>

  <!-- Table -->
  <rect y="322" width="1000" height="198" fill="url(#wood)"/>
  <path d="M0 345 C170 332 328 354 500 340 C675 326 820 348 1000 335" fill="none" stroke="#c49f73" stroke-width="3" opacity="0.38"/>
  <path d="M0 392 C210 377 405 403 598 384 C752 369 875 392 1000 381" fill="none" stroke="#c49f73" stroke-width="2" opacity="0.32"/>
  <path d="M0 454 C200 440 383 460 575 447 C730 436 875 451 1000 444" fill="none" stroke="#c49f73" stroke-width="2" opacity="0.28"/>

  <!-- Calm centre mat to seat router -->
  <ellipse cx="505" cy="405" rx="260" ry="70" fill="url(#rug)" opacity="0.24"/>
</svg>
