name: Temporary UI100 navigation fix

on:
  push:
    branches:
      - rebuild/keenetic-ui-1.0.0

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: rebuild/keenetic-ui-1.0.0
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Patch handoff contract
        run: python -c "from pathlib import Path; p=Path('custom_components/keenetic_hero_4g/frontend/keenetic-app-v100.js'); s=p.read_text(); s=s.replace('const K100_ALLOWED = [\"/dashboard-house-v11\", \"/dashboard-actions\", \"/dashboard-infrastructure\"];','const K100_ALLOWED = [\"/dashboard-house-v11/home\", \"/dashboard-actions/home\", \"/dashboard-infrastructure/overview\"];'); s=s.replace('const once=sessionStorage.getItem(\"nikas.specialized.source_route.v1\");\\n  if(once){try{const x=JSON.parse(once);const age=Date.now()-Number(x?.timestamp||0);const v=k100SafeRoute(x?.route);sessionStorage.removeItem(\"nikas.specialized.source_route.v1\");if(v&&age>=0&&age<10*60*1000)return v;}catch{sessionStorage.removeItem(\"nikas.specialized.source_route.v1\");}}','const once=sessionStorage.getItem(\"nikas.specialized.source_route.v1\"); const onceAt=sessionStorage.getItem(\"nikas.specialized.source_route_at.v1\");\\n  if(once!==null||onceAt!==null){sessionStorage.removeItem(\"nikas.specialized.source_route.v1\");sessionStorage.removeItem(\"nikas.specialized.source_route_at.v1\");const handedOffAge=Date.now()-Number(onceAt);const v=k100SafeRoute(once);if(v&&Number.isFinite(handedOffAge)&&handedOffAge>=0&&handedOffAge<10*60*1000)return v;}'); p.write_text(s)"
      - name: Build
        run: python scripts/build_frontend_bundle.py
      - name: Contract check
        run: |
          python scripts/check_nikas_ui_standard.py
          python scripts/build_frontend_bundle.py --check
          git diff --check
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add custom_components/keenetic_hero_4g/frontend/keenetic-app-v100.js custom_components/keenetic_hero_4g/frontend/keenetic-panel-bundle.js
          git commit -m 'fix: use atomic NikaS source-route handoff in UI 1.0.0'
          git push origin HEAD:rebuild/keenetic-ui-1.0.0
