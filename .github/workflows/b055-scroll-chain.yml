name: Temporary b055 scroll-chain guard
on:
  push:
    branches:
      - "fix/b055-scroll-chain"
permissions:
  contents: write
jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/b055-scroll-chain
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Apply patch
        run: python scripts/apply_b055_scroll_chain.py
      - name: Rebuild bundle
        run: python scripts/build_frontend_bundle.py
      - name: Validate
        run: |
          python scripts/build_frontend_bundle.py --check
          python scripts/check_nikas_ui_standard.py
          python -m unittest discover -s tests -v
          python -m compileall -q custom_components/keenetic_hero_4g
          node --check custom_components/keenetic_hero_4g/frontend/keenetic-app-v100.js
          node --check custom_components/keenetic_hero_4g/frontend/keenetic-panel-bundle.js
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/keenetic_hero_4g
          git commit -m "b055: contain mobile scroll to work viewport"
          git push origin HEAD:fix/b055-scroll-chain
