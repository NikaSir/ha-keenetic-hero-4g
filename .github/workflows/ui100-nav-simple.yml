name: Temporary UI100 simple navigation fix

on:
  push:
    branches:
      - "rebuild/keenetic-ui-1.0.0"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: rebuild/keenetic-ui-1.0.0
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Patch navigation
        run: |
          python -c 'from pathlib import Path; p=Path("custom_components/keenetic_hero_4g/frontend/keenetic-app-v100.js"); s=p.read_text(); s=s.replace("const K100_ALLOWED = [\"/dashboard-house-v11\", \"/dashboard-actions\", \"/dashboard-infrastructure\"];", "const K100_ALLOWED = [\"/dashboard-house-v11/home\", \"/dashboard-actions/home\", \"/dashboard-infrastructure/overview\"];"); s=s.replace("try{const u=new URL(v,location.origin);if(u.origin!==location.origin)return null;return K100_ALLOWED.some(p=>u.pathname===p||u.pathname.startsWith(`${p}/`))?`${u.pathname}${u.search}${u.hash}`:null;}catch{return null;}", "try{const url=new URL(v,window.location.origin);if(url.origin!==window.location.origin)return null;const pathname=url.pathname;return K100_ALLOWED.some(p=>pathname===p||pathname.startsWith(`${p}/`))?`${url.pathname}${url.search}${url.hash}`:null;}catch{return null;}"); old="  const once=sessionStorage.getItem(\"nikas.specialized.source_route.v1\");\n  if(once){try{const x=JSON.parse(once);const age=Date.now()-Number(x?.timestamp||0);const v=k100SafeRoute(x?.route);sessionStorage.removeItem(\"nikas.specialized.source_route.v1\");if(v&&age>=0&&age<10*60*1000)return v;}catch{sessionStorage.removeItem(\"nikas.specialized.source_route.v1\");}}"; new="  const once=sessionStorage.getItem(\"nikas.specialized.source_route.v1\");\n  const onceAt=sessionStorage.getItem(\"nikas.specialized.source_route_at.v1\");\n  if(once!==null||onceAt!==null){sessionStorage.removeItem(\"nikas.specialized.source_route.v1\");sessionStorage.removeItem(\"nikas.specialized.source_route_at.v1\");if(once!==null&&onceAt!==null){const handedOffAge=Date.now()-Number(onceAt);const v=k100SafeRoute(once);if(v&&Number.isFinite(handedOffAge)&&handedOffAge>=0&&handedOffAge<10*60*1000)return v;}}"; assert old in s; p.write_text(s.replace(old,new))'
          python -c 'from pathlib import Path; import json; p=Path(".nikas-ui-standard.json"); d=json.loads(p.read_text()); d["header_return"]["timestamp_required_marker"]="onceAt!==null"; d["header_return"]["future_timestamp_rejection_marker"]="handedOffAge>=0"; p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n")'
      - name: Build and check
        run: |
          python scripts/build_frontend_bundle.py
          python scripts/check_nikas_ui_standard.py
          python scripts/build_frontend_bundle.py --check
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/keenetic_hero_4g/frontend/keenetic-app-v100.js custom_components/keenetic_hero_4g/frontend/keenetic-panel-bundle.js .nikas-ui-standard.json
          git commit -m "fix: complete NikaS navigation contract in UI 1.0.0"
          git push origin HEAD:rebuild/keenetic-ui-1.0.0
