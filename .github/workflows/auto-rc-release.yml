name: Auto RC release

on:
  create:
  push:
    branches:
      - "release/panel-v*-rc*"
  workflow_dispatch:
    inputs:
      branch:
        description: "Release branch, e.g. release/panel-v0.2.4-rc5"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'create' && github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release/panel-v'))
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release branch
        id: ref
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            branch='${{ inputs.branch }}'
          elif [[ "${GITHUB_EVENT_NAME}" == "create" ]]; then
            branch='${{ github.event.ref }}'
          else
            branch='${GITHUB_REF_NAME}'
          fi
          if [[ ! "$branch" =~ ^release/panel-v[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+$ ]]; then
            echo "Unsupported RC branch: $branch" >&2
            exit 1
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Check out RC branch
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.ref.outputs.branch }}

      - name: Build release metadata
        id: meta
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import pathlib
          import re

          branch = "${{ steps.ref.outputs.branch }}"
          manifest = json.loads(pathlib.Path("custom_components/keenetic_hero_4g/manifest.json").read_text())
          manifest_version = manifest["version"]
          match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)-b(\d+)", manifest_version)
          if not match:
              raise SystemExit(f"Unsupported manifest version: {manifest_version}")

          const_text = pathlib.Path("custom_components/keenetic_hero_4g/const.py").read_text()
          panel_match = re.search(r'^PANEL_VERSION\s*=\s*"([^"]+)"', const_text, re.MULTILINE)
          if not panel_match:
              raise SystemExit("PANEL_VERSION not found")
          panel_version = panel_match.group(1)

          branch_match = re.fullmatch(r"release/panel-v([0-9]+\.[0-9]+\.[0-9]+)-rc(\d+)", branch)
          if not branch_match:
              raise SystemExit(f"Unsupported RC branch: {branch}")
          if branch_match.group(1) != panel_version:
              raise SystemExit(
                  f"Branch panel version {branch_match.group(1)} does not match PANEL_VERSION {panel_version}"
              )

          major, minor, _patch, build = match.groups()
          project_build = f"v{major}.{int(minor):02d}_b{int(build):03d}"
          rc = branch_match.group(2)
          tag = f"{project_build}-panel-v{panel_version}-rc{rc}"
          title = f"Keenetic panel v{panel_version} RC{rc}"

          print(f"tag={tag}")
          print(f"title={title}")
          PY

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          TITLE: ${{ steps.meta.outputs.title }}
          BRANCH: ${{ steps.ref.outputs.branch }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it immutable."
            exit 0
          fi

          gh release create "$TAG" \
            --target "$BRANCH" \
            --title "$TITLE" \
            --prerelease \
            --notes "Automated Home Assistant NikaS RC from \`$BRANCH\`. Use HACS beta/pre-release mode for installation."
