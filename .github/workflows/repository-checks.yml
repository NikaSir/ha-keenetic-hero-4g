name: Repository checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in Path('.').rglob('*.json'):
              if '.git' in path.parts:
                  continue
              with path.open(encoding='utf-8') as handle:
                  json.load(handle)
              print(f'OK {path}')
          PY

      - name: Compile Python sources when present
        run: |
          if [ -d custom_components ]; then
            python -m compileall -q custom_components
          fi

      - name: Enforce NikaS UI standard v2.2 and navigation contract v1.2
        run: python scripts/check_nikas_ui_standard.py

      - name: Verify deterministic autonomous frontend bundle
        run: python scripts/build_frontend_bundle.py --check

      - name: Run backend contract tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate panel JavaScript when present
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find custom_components -type f -path '*/frontend/*.js' -print0 2>/dev/null || true)

      - name: Exercise Shell v2.1 scroll boundaries
        run: node tests/shell_v2_harness.mjs

      - name: Reject tracked credential/key files
        shell: bash
        run: |
          forbidden="$(git ls-files | grep -E '(^|/)(secrets\.yaml|\.env($|\.)|.*\.(pem|key|p12)$)' | grep -v -E '(^|/)\.env\.example$' || true)"
          if [ -n "$forbidden" ]; then
            echo 'Forbidden credential/key-like files are tracked:'
            echo "$forbidden"
            exit 1
          fi
      - name: Verify pinned standard documents
        run: |
          python scripts/check_standard_documents.py
          python tests/test_standard_document_sync.py

