name: Temporary Keenetic UI 1.0.0 rebuild

on:
  push:
    branches:
      - rebuild/keenetic-ui-1.0.0

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: rebuild/keenetic-ui-1.0.0
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build bundle
        run: python scripts/build_frontend_bundle.py
      - name: Validate bundle
        run: |
          python scripts/build_frontend_bundle.py --check
          python -m compileall -q custom_components/keenetic_hero_4g
          git diff --check
      - name: Commit bundle
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add custom_components/keenetic_hero_4g/frontend/keenetic-panel-bundle.js
          git commit -m 'build: regenerate Keenetic UI 1.0.0 bundle'
          git push origin HEAD:rebuild/keenetic-ui-1.0.0
