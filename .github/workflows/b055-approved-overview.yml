name: Temporary b055 approved overview rebuild

on:
  push:
    branches:
      - "rebuild/b055-approved-overview"

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: rebuild/b055-approved-overview
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Apply approved overview baseline
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('.')
          f=root/'custom_components/keenetic_hero_4g/frontend/keenetic-app-v090.js'
          s=f.read_text(encoding='utf-8')
          s=s.replace('top:31.5%!important;\n      left:49%!important;\n      width:158px!important;\n      min-width:158px!important;\n      max-width:158px!important;', 'top:27.5%!important;\n      left:50%!important;\n      width:158px!important;\n      min-width:158px!important;\n      max-width:158px!important;')
          s=s.replace('top:32.5%!important;\n        left:47%!important;', 'top:28.5%!important;\n        left:50%!important;')
          insert='''\n    .v083-overview .v060-router{\n      top:61%!important;\n      width:38%!important;\n      max-width:240px!important;\n    }\n    .v083-overview .v061-cable{left:3.2%!important;top:55%!important}\n    .v083-overview .v061-lan{right:3.2%!important;top:55%!important}\n    .v083-overview .v083-reserve-channel{display:none!important}\n    @media(max-width:390px){\n      .v083-overview .v060-router{top:61%!important;width:38%!important;max-width:226px!important}\n      .v083-overview .v061-cable{left:2.8%!important;top:55%!important}\n      .v083-overview .v061-lan{right:2.8%!important;top:55%!important}\n    }\n'''
          s=s.replace('  `;\n  root.append(style);', insert+'  `;\n  root.append(style);',1)
          s=s.replace('const d = "M490 215 L500 406";', 'const d = "M500 190 L500 390";')
          f.write_text(s,encoding='utf-8')

          r=root/'custom_components/keenetic_hero_4g/panel_runtime.py'
          s=r.read_text(encoding='utf-8').replace('FRONTEND_CACHE_KEY = "0.9.0-b054"','FRONTEND_CACHE_KEY = "0.9.0-b055"')
          r.write_text(s,encoding='utf-8')
          PY
      - name: Rebuild autonomous bundle
        run: python scripts/build_frontend_bundle.py
      - name: Validate
        run: |
          python scripts/build_frontend_bundle.py --check
          python -m unittest discover -s tests -v
          python -m compileall -q custom_components/keenetic_hero_4g
          git diff --check
      - name: Commit approved baseline
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/keenetic_hero_4g/frontend/keenetic-app-v090.js custom_components/keenetic_hero_4g/frontend/keenetic-panel-bundle.js custom_components/keenetic_hero_4g/panel_runtime.py
          git commit -m "b055: apply approved Keenetic overview baseline"
          git push origin HEAD:rebuild/b055-approved-overview
