name: Temporary b053 bundle rebuild

on:
  push:
    branches:
      - "fix/b053-lte-indicator-clearance"

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/b053-lte-indicator-clearance
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Rebuild autonomous frontend bundle
        run: python scripts/build_frontend_bundle.py
      - name: Commit generated bundle
        shell: bash
        run: |
          if git diff --quiet -- custom_components/keenetic_hero_4g/frontend/keenetic-panel-bundle.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/keenetic_hero_4g/frontend/keenetic-panel-bundle.js
          git commit -m "build: regenerate Keenetic frontend bundle"
          git push origin HEAD:fix/b053-lte-indicator-clearance
