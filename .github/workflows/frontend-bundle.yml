          grep -q 'MAX_VIEWPORT_RETRIES_V078 = 24' custom_components/keenetic_hero_4g/frontend/keenetic-app-v078.js
          grep -q 'if (!viewport || !stage || !surface || !this._child) return false' custom_components/keenetic_hero_4g/frontend/keenetic-app-v078.js
          grep -q 'capture: true, passive: false' custom_components/keenetic_hero_4g/frontend/keenetic-app-v078.js
          grep -q 'new ResizeObserver' custom_components/keenetic_hero_4g/frontend/keenetic-app-v078.js
          grep -q 'contentHeightV078' custom_components/keenetic_hero_4g/frontend/keenetic-app-v078.js
          grep -q 'this._standardBaseHeightV074 \* scale' custom_components/keenetic_hero_4g/frontend/keenetic-app-v078.js
