          grep -q 'keenetic-hero-router-v086.webp' custom_components/keenetic_hero_4g/frontend/keenetic-app-v086.js
          grep -q 'M500 228 L500 406' custom_components/keenetic_hero_4g/frontend/keenetic-app-v086.js
          grep -q 'M500 210 L500 406' custom_components/keenetic_hero_4g/frontend/keenetic-app-v088.js
