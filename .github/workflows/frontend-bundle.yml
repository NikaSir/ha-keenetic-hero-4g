name: Frontend bundle

on:
  push:
    branches:
      - "ui/header-tabbar-*"
      - "fix/b019-*"
      - "ui/b020-*"
      - "fix/b021-*"
      - "refactor/b022-*"
      - "ui/b023-*"
      - "ui/b024-*"
    paths:
      - "custom_components/keenetic_hero_4g/frontend/**"
      - "custom_components/keenetic_hero_4g/panel_runtime.py"
      - "custom_components/keenetic_hero_4g/panel_contract.json"
      - "custom_components/keenetic_hero_4g/panel_manifest.json"
      - "custom_components/keenetic_hero_4g/const.py"
      - "scripts/build_frontend_bundle.py"
      - ".github/workflows/frontend-bundle.yml"
  pull_request:
    paths:
      - "custom_components/keenetic_hero_4g/frontend/**"
      - "custom_components/keenetic_hero_4g/panel_runtime.py"
      - "custom_components/keenetic_hero_4g/panel_contract.json"
      - "custom_components/keenetic_hero_4g/panel_manifest.json"
      - "custom_components/keenetic_hero_4g/const.py"
      - "scripts/build_frontend_bundle.py"
      - ".github/workflows/frontend-bundle.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build autonomous frontend bundle
        run: python scripts/build_frontend_bundle.py

      - name: Verify production bundle syntax and dependency contract
        shell: bash
        run: |
          node --check custom_components/keenetic_hero_4g/frontend/keenetic-panel-bundle.js
          if grep -nE '^[[:space:]]*(import|export|await[[:space:]]+import)[[:space:](]' custom_components/keenetic_hero_4g/frontend/keenetic-panel-bundle.js; then
            echo "Production panel bundle must not contain runtime module dependencies."
            exit 1
          fi
          if grep -q 'keenetic-panel.css?v=' custom_components/keenetic_hero_4g/frontend/keenetic-panel-bundle.js; then
            echo "Production panel bundle must contain its own CSS."
            exit 1
          fi
          if grep -qE 'data:image/|base64,' custom_components/keenetic_hero_4g/frontend/keenetic-panel-bundle.js; then
            echo "Production panel bundle must not contain Base64 image payloads."
            exit 1
          fi

      - name: Verify UI v0.6.1 accepted topology contract
        shell: bash
        run: |
          grep -q 'PANEL_VERSION = "0.6.1"' custom_components/keenetic_hero_4g/const.py
          grep -q 'keenetic-panel-bundle.js' custom_components/keenetic_hero_4g/panel_runtime.py
          grep -q '"version": "0.6.1"' custom_components/keenetic_hero_4g/panel_contract.json
          grep -q '"web_component": "keenetic-hero-app-panel-v061"' custom_components/keenetic_hero_4g/panel_contract.json
          grep -q '"hero_artwork_format": "layered_local_assets"' custom_components/keenetic_hero_4g/panel_contract.json
          grep -q '"connections": "dynamic_svg_dom"' custom_components/keenetic_hero_4g/panel_contract.json
          grep -q '"upper_left": "lte_reserve"' custom_components/keenetic_hero_4g/panel_contract.json
          grep -q '"lower_left": "ethernet_cable"' custom_components/keenetic_hero_4g/panel_contract.json
          grep -q '"right": "lan"' custom_components/keenetic_hero_4g/panel_contract.json
          grep -q '"center_internet_cloud": false' custom_components/keenetic_hero_4g/panel_contract.json
          grep -q '"outlet_artwork": false' custom_components/keenetic_hero_4g/panel_contract.json
          grep -q '"assets_directory": "frontend/assets"' custom_components/keenetic_hero_4g/panel_contract.json
          grep -q '"inline_base64_assets_allowed": false' custom_components/keenetic_hero_4g/panel_contract.json
          grep -q '"websocket_refresh": "background_only"' custom_components/keenetic_hero_4g/panel_contract.json
          grep -q '"structural_polling_seconds": 0' custom_components/keenetic_hero_4g/panel_contract.json
          grep -q 'CustomEvent("hass-toggle-menu"' custom_components/keenetic_hero_4g/frontend/keenetic-app-v045.js
          test -s custom_components/keenetic_hero_4g/frontend/assets/keenetic-hero-room-v060.svg
          test -s custom_components/keenetic_hero_4g/frontend/assets/keenetic-hero-router-v060.svg
          grep -q 'v061-topology-layer' custom_components/keenetic_hero_4g/frontend/keenetic-app-v061.js
          grep -q 'v061-cable-line' custom_components/keenetic_hero_4g/frontend/keenetic-app-v061.js
          grep -q 'v061-lte-line' custom_components/keenetic_hero_4g/frontend/keenetic-app-v061.js
          grep -q 'v061-lan-line' custom_components/keenetic_hero_4g/frontend/keenetic-app-v061.js
          grep -q '"4G LTE"' custom_components/keenetic_hero_4g/frontend/keenetic-app-v061.js
          grep -q '"Кабель"' custom_components/keenetic_hero_4g/frontend/keenetic-app-v061.js
          grep -q '"LAN"' custom_components/keenetic_hero_4g/frontend/keenetic-app-v061.js
          grep -q 'keenetic-hero-app-panel-v061' custom_components/keenetic_hero_4g/frontend/keenetic-app-v061.js
          grep -q 'keenetic-app-v061.js' scripts/build_frontend_bundle.py
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("custom_components/keenetic_hero_4g")
          manifest = json.loads((root / "panel_manifest.json").read_text(encoding="utf-8"))
          assert manifest["panel_version"] == "0.6.1"
          assert manifest["assets_directory"] == "frontend/assets"
          roles = {asset["role"] for asset in manifest["assets"]}
          assert roles == {"overview_hero_background", "overview_router_layer"}
          for asset in manifest["assets"]:
              path = root / asset["path"]
              assert path.is_file() and path.stat().st_size > 0, path
              assert asset["url"].endswith("?v=0.6.1"), asset
          PY

      - name: Commit generated bundle when changed
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          BUNDLE=custom_components/keenetic_hero_4g/frontend/keenetic-panel-bundle.js
          if [ -z "$(git status --porcelain -- "$BUNDLE")" ]; then
            echo "Bundle already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$BUNDLE"
          git commit -m "build: refresh Keenetic UI v0.6.1 autonomous bundle"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Verify bundle is current
        shell: bash
        run: |
          python scripts/build_frontend_bundle.py --check
          git diff --exit-code -- custom_components/keenetic_hero_4g/frontend/keenetic-panel-bundle.js
