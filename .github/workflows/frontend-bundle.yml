name: Frontend bundle

on:
  push:
    paths:
      - "custom_components/keenetic_hero_4g/frontend/**"
      - "custom_components/keenetic_hero_4g/panel_runtime.py"
      - "custom_components/keenetic_hero_4g/panel_contract.json"
      - "custom_components/keenetic_hero_4g/panel_manifest.json"
      - "custom_components/keenetic_hero_4g/const.py"
      - "scripts/build_frontend_bundle.py"
      - "scripts/check_nikas_ui_standard.py"
      - "docs/NIKAS_SPECIALIZED_PANEL_UI_STANDARD.md"
      - "docs/NIKAS_PANEL_NAVIGATION_CONTRACT.md"
      - ".nikas-ui-standard.json"
      - ".github/workflows/frontend-bundle.yml"
  pull_request:
    paths:
      - "custom_components/keenetic_hero_4g/frontend/**"
      - "custom_components/keenetic_hero_4g/panel_runtime.py"
      - "custom_components/keenetic_hero_4g/panel_contract.json"
      - "custom_components/keenetic_hero_4g/panel_manifest.json"
      - "custom_components/keenetic_hero_4g/const.py"
      - "scripts/build_frontend_bundle.py"
      - "scripts/check_nikas_ui_standard.py"
      - "docs/NIKAS_SPECIALIZED_PANEL_UI_STANDARD.md"
      - "docs/NIKAS_PANEL_NAVIGATION_CONTRACT.md"
      - ".nikas-ui-standard.json"
      - ".github/workflows/frontend-bundle.yml"
  workflow_dispatch:

concurrency:
  group: keenetic-frontend-bundle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Synchronize the production v1.9 viewport contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("custom_components/keenetic_hero_4g/panel_contract.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["app_shell"]["content_zoom"]["viewport_binding_requires_nodes"] = [
              "k100-work",
              "k100-stage",
              "k100-surface",
          ]
          path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Enforce NikaS UI standard v1.9 and navigation contract v1.1
        run: python scripts/check_nikas_ui_standard.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Regenerate deterministic autonomous frontend bundle
        run: python scripts/build_frontend_bundle.py

      - name: Verify production bundle syntax and dependency contract
        shell: bash
        run: |
          node --check custom_components/keenetic_hero_4g/frontend/keenetic-panel-bundle.js
          if grep -nE '^[[:space:]]*(import|export|await[[:space:]]+import)[[:space:](]' custom_components/keenetic_hero_4g/frontend/keenetic-panel-bundle.js; then
            echo "Production panel bundle must not contain runtime module dependencies."
            exit 1
          fi
          if grep -q 'keenetic-panel.css?v=' custom_components/keenetic_hero_4g/frontend/keenetic-panel-bundle.js; then
            echo "Production panel bundle must contain its own CSS."
            exit 1
          fi
          if grep -qE 'data:image/|base64,' custom_components/keenetic_hero_4g/frontend/keenetic-panel-bundle.js; then
            echo "Production panel bundle must not contain Base64 image payloads."
            exit 1
          fi

      - name: Commit synchronized contract and bundle
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- custom_components/keenetic_hero_4g/panel_contract.json custom_components/keenetic_hero_4g/frontend/keenetic-panel-bundle.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/keenetic_hero_4g/panel_contract.json custom_components/keenetic_hero_4g/frontend/keenetic-panel-bundle.js
          git commit -m "Build: synchronize Keenetic UI 1.0.0 bundle"
          git push origin "HEAD:${GITHUB_REF_NAME}"
