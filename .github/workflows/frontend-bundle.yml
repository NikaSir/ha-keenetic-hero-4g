name: Frontend bundle

on:
  pull_request:
    paths:
      - "custom_components/keenetic_hero_4g/frontend/**"
      - "custom_components/keenetic_hero_4g/__init__.py"
      - "custom_components/keenetic_hero_4g/panel.py"
      - "custom_components/keenetic_hero_4g/panel_contract.json"
      - ".github/workflows/frontend-bundle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify current JavaScript syntax
        run: |
          node --check custom_components/keenetic_hero_4g/frontend/keenetic-panel.js
          node --check custom_components/keenetic_hero_4g/frontend/keenetic-overview-v040.js
          node --check custom_components/keenetic_hero_4g/frontend/keenetic-app-v040.js

      - name: Verify production module registration
        shell: bash
        run: |
          grep -q 'from .panel import async_register_native_panel, async_unregister_native_panel' custom_components/keenetic_hero_4g/__init__.py
          if grep -q 'panel_v030' custom_components/keenetic_hero_4g/__init__.py; then
            echo "Legacy panel_v030 must not be in the runtime startup path."
            exit 1
          fi
          grep -q 'PANEL_COMPONENT = "keenetic-hero-app-panel-v040"' custom_components/keenetic_hero_4g/panel.py
          grep -q 'keenetic-app-v040.js' custom_components/keenetic_hero_4g/panel.py
          grep -q '"version": "0.4.0"' custom_components/keenetic_hero_4g/panel_contract.json
          grep -q '"mode": "versioned_module"' custom_components/keenetic_hero_4g/panel_contract.json
          grep -q '"module": "keenetic-app-v040.js"' custom_components/keenetic_hero_4g/panel_contract.json
          grep -q '"web_component": "keenetic-hero-app-panel-v040"' custom_components/keenetic_hero_4g/panel_contract.json
          grep -q '"runtime_previous_version_imports": false' custom_components/keenetic_hero_4g/panel_contract.json
          echo "Production UI v0.4.0 registration contract OK"
