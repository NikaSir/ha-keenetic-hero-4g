name: Frontend bundle

on:
  push:
    branches:
      - "hardening/self-contained-frontend-*"
      - "fix/panel-safe-mode-*"
    paths:
      - "custom_components/keenetic_hero_4g/frontend/**"
      - "scripts/build_frontend_bundle.py"
      - ".github/workflows/frontend-bundle.yml"
  pull_request:
    paths:
      - "custom_components/keenetic_hero_4g/frontend/**"
      - "custom_components/keenetic_hero_4g/panel.py"
      - "scripts/build_frontend_bundle.py"
      - ".github/workflows/frontend-bundle.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build deterministic panel bundle
        run: python scripts/build_frontend_bundle.py

      - name: Verify JavaScript syntax
        run: node --check custom_components/keenetic_hero_4g/frontend/keenetic-panel-bundle.js

      - name: Reject runtime imports in production bundle
        shell: bash
        run: |
          if grep -nE '^[[:space:]]*(import|export)[[:space:]]' custom_components/keenetic_hero_4g/frontend/keenetic-panel-bundle.js; then
            echo "Production panel bundle must be self-contained."
            exit 1
          fi

      - name: Verify committed bundle on pull request
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          BUNDLE=custom_components/keenetic_hero_4g/frontend/keenetic-panel-bundle.js
          if git ls-files --error-unmatch "$BUNDLE" >/dev/null 2>&1; then
            git diff --exit-code -- "$BUNDLE"
          else
            echo "Bundle bootstrap: generated artifact will be committed by the branch push workflow."
          fi

      - name: Commit generated bundle on supported branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          BUNDLE=custom_components/keenetic_hero_4g/frontend/keenetic-panel-bundle.js
          if git diff --quiet -- "$BUNDLE" && git ls-files --error-unmatch "$BUNDLE" >/dev/null 2>&1; then
            echo "Bundle already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$BUNDLE"
          git commit -m "build: refresh self-contained Keenetic panel bundle"
          git push origin HEAD:"$GITHUB_REF_NAME"
