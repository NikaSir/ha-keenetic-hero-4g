name: Frontend bundle

on:
  push:
    branches:
      - "ui/header-tabbar-*"
      - "fix/b019-*"
      - "ui/b020-*"
      - "fix/b021-*"
      - "refactor/b022-*"
      - "ui/b023-*"
      - "ui/b024-*"
      - "ui/b025-*"
      - "ui/b026-*"
      - "ui/b027-*"
      - "ui/b028-*"
      - "ui/b029-*"
      - "ui/b030-*"
      - "ui/b031-*"
      - "ui/b032-*"
      - "fix/b033-*"
      - "fix/b034-*"
      - "fix/b035-*"
      - "fix/b036-*"
    paths:
      - "custom_components/keenetic_hero_4g/frontend/**"
      - "custom_components/keenetic_hero_4g/panel_runtime.py"
      - "custom_components/keenetic_hero_4g/panel_contract.json"
      - "custom_components/keenetic_hero_4g/panel_manifest.json"
      - "custom_components/keenetic_hero_4g/const.py"
      - "scripts/build_frontend_bundle.py"
      - ".github/workflows/frontend-bundle.yml"
  pull_request:
    paths:
      - "custom_components/keenetic_hero_4g/frontend/**"
      - "custom_components/keenetic_hero_4g/panel_runtime.py"
      - "custom_components/keenetic_hero_4g/panel_contract.json"
      - "custom_components/keenetic_hero_4g/panel_manifest.json"
      - "custom_components/keenetic_hero_4g/const.py"
      - "scripts/build_frontend_bundle.py"
      - ".github/workflows/frontend-bundle.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build autonomous frontend bundle
        run: python scripts/build_frontend_bundle.py

      - name: Verify production bundle syntax and dependency contract
        shell: bash
        run: |
          node --check custom_components/keenetic_hero_4g/frontend/keenetic-panel-bundle.js
          if grep -nE '^[[:space:]]*(import|export|await[[:space:]]+import)[[:space:](]' custom_components/keenetic_hero_4g/frontend/keenetic-panel-bundle.js; then
            echo "Production panel bundle must not contain runtime module dependencies."
            exit 1
          fi
          if grep -q 'keenetic-panel.css?v=' custom_components/keenetic_hero_4g/frontend/keenetic-panel-bundle.js; then
            echo "Production panel bundle must contain its own CSS."
            exit 1
          fi
          if grep -qE 'data:image/|base64,' custom_components/keenetic_hero_4g/frontend/keenetic-panel-bundle.js; then
            echo "Production panel bundle must not contain Base64 image payloads."
            exit 1
          fi

      - name: Verify UI v0.7.4 standard shell and idempotent Failover
        shell: bash
        run: |
          grep -q 'PANEL_VERSION = "0.7.4"' custom_components/keenetic_hero_4g/const.py
          grep -q 'keenetic-panel-bundle.js' custom_components/keenetic_hero_4g/panel_runtime.py
          grep -q '"version": "0.7.4"' custom_components/keenetic_hero_4g/panel_contract.json
          grep -q '"web_component": "keenetic-hero-app-panel-v074"' custom_components/keenetic_hero_4g/panel_contract.json
          grep -q '"hero_artwork_format": "layered_local_assets"' custom_components/keenetic_hero_4g/panel_contract.json
          grep -q '"connections": "dynamic_svg_dom"' custom_components/keenetic_hero_4g/panel_contract.json
          grep -q '"room": "/keenetic_hero_4g_static/assets/keenetic-hero-room-v064.webp"' custom_components/keenetic_hero_4g/panel_contract.json
          grep -q '"router": "/keenetic_hero_4g_static/assets/keenetic-hero-router-v063.webp"' custom_components/keenetic_hero_4g/panel_contract.json
          grep -q '"separate_path_segments": true' custom_components/keenetic_hero_4g/panel_contract.json
          grep -q '"router_blocks_path_visual": true' custom_components/keenetic_hero_4g/panel_contract.json
          grep -q '"status_primary_label_ethernet": "Ethernet"' custom_components/keenetic_hero_4g/panel_contract.json
          grep -q '"safe_area_applied_once": true' custom_components/keenetic_hero_4g/panel_contract.json
          grep -q '"safe_area_owner": "specialized_panel_shell"' custom_components/keenetic_hero_4g/panel_contract.json
          grep -q '"safe_area_top": true' custom_components/keenetic_hero_4g/panel_contract.json
          grep -q '"event_bubbles": true' custom_components/keenetic_hero_4g/panel_contract.json
          grep -q '"event_composed": true' custom_components/keenetic_hero_4g/panel_contract.json
          grep -q '"scope": "central_work_area_only"' custom_components/keenetic_hero_4g/panel_contract.json
          grep -q '"gesture": "two_finger_pinch"' custom_components/keenetic_hero_4g/panel_contract.json
          grep -q '"engine": "native_vertical_at_100_transform_pan_above_100"' custom_components/keenetic_hero_4g/panel_contract.json
          grep -q '"permanent_controls": false' custom_components/keenetic_hero_4g/panel_contract.json
          grep -q '"min_percent": 75' custom_components/keenetic_hero_4g/panel_contract.json
          grep -q '"max_percent": 200' custom_components/keenetic_hero_4g/panel_contract.json
          grep -q '"reset_gesture": "two_finger_double_tap"' custom_components/keenetic_hero_4g/panel_contract.json
          grep -q '"gesture_click_guard_ms": 380' custom_components/keenetic_hero_4g/panel_contract.json
          grep -q '"center_internet_cloud": false' custom_components/keenetic_hero_4g/panel_contract.json
          grep -q '"outlet_artwork": false' custom_components/keenetic_hero_4g/panel_contract.json
          grep -q '"inline_base64_assets_allowed": false' custom_components/keenetic_hero_4g/panel_contract.json
          grep -q '"websocket_refresh": "background_only"' custom_components/keenetic_hero_4g/panel_contract.json
          grep -q '"structural_polling_seconds": 0' custom_components/keenetic_hero_4g/panel_contract.json
          test -s custom_components/keenetic_hero_4g/frontend/assets/keenetic-hero-room-v064.webp
          test -s custom_components/keenetic_hero_4g/frontend/assets/keenetic-hero-router-v063.webp
          grep -q 'keenetic-hero-room-v064.webp' custom_components/keenetic_hero_4g/frontend/keenetic-app-v064.js
          grep -q 'keenetic-hero-app-panel-v064' custom_components/keenetic_hero_4g/frontend/keenetic-app-v064.js
          grep -q 'keenetic-hero-app-panel-v065' custom_components/keenetic_hero_4g/frontend/keenetic-app-v065.js
          grep -q 'nikas.keenetic.contentZoom.v1' custom_components/keenetic_hero_4g/frontend/keenetic-app-v065.js
          grep -q 'touch-action:pan-x pan-y' custom_components/keenetic_hero_4g/frontend/keenetic-app-v065.js
          grep -q 'nika-zoom-dock' custom_components/keenetic_hero_4g/frontend/keenetic-app-v065.js
          grep -q 'keenetic-hero-app-panel-v066' custom_components/keenetic_hero_4g/frontend/keenetic-app-v066.js
          grep -q 'calc(4px + env(safe-area-inset-top,0px))' custom_components/keenetic_hero_4g/frontend/keenetic-app-v066.js
          grep -q 'keenetic-hero-app-panel-v067' custom_components/keenetic_hero_4g/frontend/keenetic-app-v067.js
          grep -q 'translate3d(' custom_components/keenetic_hero_4g/frontend/keenetic-app-v067.js
          grep -q 'touch-action:none' custom_components/keenetic_hero_4g/frontend/keenetic-app-v067.js
          grep -q 'Масштаб 100%' custom_components/keenetic_hero_4g/frontend/keenetic-app-v067.js
          grep -q 'pointercancel' custom_components/keenetic_hero_4g/frontend/keenetic-app-v067.js
          grep -q 'keenetic-hero-app-panel-v068' custom_components/keenetic_hero_4g/frontend/keenetic-app-v068.js
          grep -q '.v063-flow-layer{z-index:2!important}' custom_components/keenetic_hero_4g/frontend/keenetic-app-v068.js
          grep -q '.v060-router{z-index:3!important}' custom_components/keenetic_hero_4g/frontend/keenetic-app-v068.js
          grep -q 'keenetic-hero-app-panel-v069' custom_components/keenetic_hero_4g/frontend/keenetic-app-v069.js
          grep -q 'padding-bottom:calc(4px + env(safe-area-inset-bottom,0px))!important' custom_components/keenetic_hero_4g/frontend/keenetic-app-v069.js
          grep -q 'keenetic-hero-app-panel-v070' custom_components/keenetic_hero_4g/frontend/keenetic-app-v070.js
          grep -q 'this._nikaCanvasResizeObserverV067?.disconnect()' custom_components/keenetic_hero_4g/frontend/keenetic-app-v070.js
          grep -q 'queueMicrotask(() =>' custom_components/keenetic_hero_4g/frontend/keenetic-app-v070.js
          grep -q 'keenetic-hero-app-panel-v071' custom_components/keenetic_hero_4g/frontend/keenetic-app-v071.js
          grep -q 'this._teardownNikaZoom?.()' custom_components/keenetic_hero_4g/frontend/keenetic-app-v071.js
          grep -q '_applyNikaZoom()' custom_components/keenetic_hero_4g/frontend/keenetic-app-v071.js
          grep -q 'overflow-y:auto!important' custom_components/keenetic_hero_4g/frontend/keenetic-app-v071.js
          grep -q 'transform:none!important' custom_components/keenetic_hero_4g/frontend/keenetic-app-v071.js
          grep -q 'keenetic-hero-app-panel-v072' custom_components/keenetic_hero_4g/frontend/keenetic-app-v072.js
          grep -q 'SAFE_ZOOM_MIN_V072 = 0.75' custom_components/keenetic_hero_4g/frontend/keenetic-app-v072.js
          grep -q 'surface.addEventListener("touchstart"' custom_components/keenetic_hero_4g/frontend/keenetic-app-v072.js
          grep -q 'data-safe-zoom-reset' custom_components/keenetic_hero_4g/frontend/keenetic-app-v072.js
          if grep -q 'ResizeObserver' custom_components/keenetic_hero_4g/frontend/keenetic-app-v072.js; then exit 1; fi
          grep -q 'keenetic-hero-app-panel-v073' custom_components/keenetic_hero_4g/frontend/keenetic-app-v073.js
          grep -q 'if (this._failoverHistoryDisabledV073) return' custom_components/keenetic_hero_4g/frontend/keenetic-app-v073.js
          grep -q 'this._failoverHistoryDisabledV073 = true' custom_components/keenetic_hero_4g/frontend/keenetic-app-v073.js
          if grep -q 'history/history_during_period' custom_components/keenetic_hero_4g/frontend/keenetic-app-v073.js; then exit 1; fi
          grep -q 'keenetic-hero-app-panel-v074' custom_components/keenetic_hero_4g/frontend/keenetic-app-v074.js
          grep -q 'native-scroll-v074' custom_components/keenetic_hero_4g/frontend/keenetic-app-v074.js
          grep -q 'DOUBLE_TAP_DELAY_V074' custom_components/keenetic_hero_4g/frontend/keenetic-app-v074.js
          grep -q 'Масштаб 100%' custom_components/keenetic_hero_4g/frontend/keenetic-app-v074.js
          grep -q 'keenetic-hero-router-v063.webp' custom_components/keenetic_hero_4g/frontend/keenetic-app-v063.js
          grep -q 'v063-flow-layer' custom_components/keenetic_hero_4g/frontend/keenetic-app-v063.js
          grep -q 'v063-cable-line' custom_components/keenetic_hero_4g/frontend/keenetic-app-v063.js
          grep -q 'v063-lte-line' custom_components/keenetic_hero_4g/frontend/keenetic-app-v063.js
          grep -q 'v063-lan-line' custom_components/keenetic_hero_4g/frontend/keenetic-app-v063.js
          grep -q 'replace(/Кабель/gi, "Ethernet")' custom_components/keenetic_hero_4g/frontend/keenetic-app-v063.js
          grep -q 'keenetic-hero-app-panel-v063' custom_components/keenetic_hero_4g/frontend/keenetic-app-v063.js
          grep -q 'padding-bottom:4px!important' custom_components/keenetic_hero_4g/frontend/keenetic-app-v063.js
          grep -q 'keenetic-app-v074.js' scripts/build_frontend_bundle.py
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("custom_components/keenetic_hero_4g")
          manifest = json.loads((root / "panel_manifest.json").read_text(encoding="utf-8"))
          assert manifest["panel_version"] == "0.7.4"
          assert manifest["schema_version"] == 2
          assert manifest["route"] == "/dashboard-keenetic"
          assert manifest["entry_module"] == "keenetic-panel-bundle.js"
          assert manifest["web_component"] == "keenetic-hero-app-panel-v074"
          assert manifest["ha_menu_event"] == {
              "type": "hass-toggle-menu", "bubbles": True, "composed": True
          }
          assert manifest["zoom_policy"]["engine"] == "native_vertical_at_100_transform_pan_above_100"
          assert manifest["zoom_policy"]["permanent_controls"] is False
          assert manifest["assets_directory"] == "frontend/assets"
          roles = {asset["role"] for asset in manifest["assets"]}
          assert roles == {"overview_hero_background", "overview_router_layer"}
          for asset in manifest["assets"]:
              path = root / asset["path"]
              assert path.is_file() and path.stat().st_size > 0, path
              assert asset["url"].endswith("?v=0.7.4"), asset
          PY

      - name: Commit generated bundle when changed
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          BUNDLE=custom_components/keenetic_hero_4g/frontend/keenetic-panel-bundle.js
          if [ -z "$(git status --porcelain -- "$BUNDLE")" ]; then
            echo "Bundle already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$BUNDLE"
          git commit -m "build: refresh Keenetic UI v0.7.4 autonomous bundle"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Verify bundle is current
        shell: bash
        run: |
          python scripts/build_frontend_bundle.py --check
          git diff --exit-code -- custom_components/keenetic_hero_4g/frontend/keenetic-panel-bundle.js
