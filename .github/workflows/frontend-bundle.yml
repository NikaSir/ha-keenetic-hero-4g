          for legacy in v066 v067 v069 v070 v071 v072 v074 v077 v078; do
            if grep -q "BEGIN custom_components/keenetic_hero_4g/frontend/keenetic-app-${legacy}.js" custom_components/keenetic_hero_4g/frontend/keenetic-panel-bundle.js; then
