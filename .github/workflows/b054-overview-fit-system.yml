name: Temporary b054 overview fit and system view
on:
  push:
    branches:
      - "fix/b054-overview-fit-system"
permissions:
  contents: write
jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/b054-overview-fit-system
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Apply patch
        run: python scripts/apply_b054_overview_fit_system.py
      - name: Rebuild bundle
        run: python scripts/build_frontend_bundle.py
      - name: Validate
        shell: bash
        run: |
          python scripts/build_frontend_bundle.py --check
          python scripts/check_nikas_ui_standard.py
          python -m unittest discover -s tests -p 'test_*.py' -v
          python -m compileall -q custom_components/keenetic_hero_4g
          node --check custom_components/keenetic_hero_4g/frontend/keenetic-panel-bundle.js
          git diff --check
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .nikas-ui-standard.json scripts/build_frontend_bundle.py tests custom_components/keenetic_hero_4g
          git commit -m "b054: fit overview and keep system diagnostics view"
          git push origin HEAD:fix/b054-overview-fit-system
