name: Temporary b053 tabs and viewport fix

on:
  push:
    branches:
      - "fix/ui-1.0.1-tabs-viewport"

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/ui-1.0.1-tabs-viewport
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Apply UI 1.0.1 patch
        run: python scripts/apply_b053_tabs_viewport.py

      - name: Rebuild autonomous frontend bundle
        run: python scripts/build_frontend_bundle.py

      - name: Validate UI 1.0.1
        shell: bash
        run: |
          python scripts/build_frontend_bundle.py --check
          python scripts/check_nikas_ui_standard.py
          python -m unittest discover -s tests -p 'test_*.py' -v
          python -m compileall -q custom_components/keenetic_hero_4g
          node --check custom_components/keenetic_hero_4g/frontend/keenetic-panel-bundle.js
          git diff --check

      - name: Commit UI 1.0.1 fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .nikas-ui-standard.json scripts/build_frontend_bundle.py tests custom_components/keenetic_hero_4g
          git commit -m "b053: preserve selected tabs and crop mobile overview"
          git push origin HEAD:fix/ui-1.0.1-tabs-viewport
