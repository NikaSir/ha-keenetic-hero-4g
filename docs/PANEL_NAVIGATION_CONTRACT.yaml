panel:
  id: keenetic
  title: Keenetic
  path: /dashboard-keenetic
  icon: mdi:router-network
  owner: ha-keenetic-hero-4g
  parent_route: /dashboard-infrastructure/overview
  expose_in_generated_ui: true
  preferred_view: overview
  version: 0.7.5

app_shell:
  standard: Home Assistant NikaS specialized panel
  version: 1.6
  header:
    menu:
      icon: mdi:menu
      action: hass-toggle-menu
      event_bubbles: true
      event_composed: true
      min_touch_target_px: 44
    title: Keenetic Hero 4G+
    title_alignment: viewport_center
    side_slots_px: 52
    side_slots_px_narrow: 48
    control_size_px: 44
    control_radius_px: 16
    control_icon_px: 25
    title_px: 23
    subtitle_px: 14
    title_px_narrow: 21
    subtitle_px_narrow: 13
    show_brand_icon: false
    actions:
      - refresh
  bottom_navigation:
    fixed: true
    edge_attached: true
    full_width_mobile: true
    floating: false
    safe_area: true
    outside_scroll_region: true
    overlaps_content: false
    icon_px: 28
    label_px: 12
    label_weight: 700
    max_primary_items: 5
    items:
      - overview
      - wan
      - failover
      - traffic
      - diagnostics
  secondary_views:
    - system
  content_zoom:
    scope: central_work_area_only
    single_viewport_per_panel_instance: true
    min_percent: 75
    max_percent: 200
    snap_to_100_percent: [97, 103]
    reset_gesture: two_finger_double_tap
    native_vertical_scroll_at_100_percent: true
    horizontal_scroll_at_100_percent: false
    pan_only_above_100_percent: true
    pan_axes: overflow_only
  stable_updates:
    shell_mount: once
    hass_update: point_patch
    tab_switch: hidden_inert
    full_dom_replacement_after_mount: false
  optional_connection_indicator:
    enabled: false
    policy: explicit_request_only
  typography:
    meaningful_minimum_px: 12
    maximum_px: 25

frontend_delivery:
  mode: self_contained_bundle
  module: keenetic-panel-bundle.js
  includes_styles: true
  cache_busting: query_panel_version
  runtime_previous_version_imports: false

view_patterns:
  overview:
    preserve_network_topology: true
    channel_selector: contextual_segmented
    items:
      - id: ethernet
        label: Провод
      - id: lte
        label: LTE
    default_selected_from_role: active_wan
    active_branch_indicator: true
    single_channel_detail_visible: true
    unknown_active_wan_has_no_fabricated_default: true
    device_selector: false
    device_control: false
  wan:
    selector: contextual_segmented
    items:
      - id: ethernet
        label: Провод
      - id: lte
        label: LTE
    single_detail_visible: true
    device_selector: false
  traffic:
    periods:
      - 24h
      - 7d
      - 30d
    refresh_on_each_selection: true
    stale_period_cache_must_not_suppress_reload: true
    late_response_must_not_replace_current_period_state: true
