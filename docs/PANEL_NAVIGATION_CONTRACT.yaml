panel:
  id: keenetic
  title: Keenetic
  path: /dashboard-keenetic
  icon: mdi:router-network
  owner: ha-keenetic-hero-4g
  parent_route: /dashboard-infrastructure/overview
  panel_root: /dashboard-keenetic
  entry_route: /dashboard-keenetic
  safe_return_route: /dashboard-infrastructure/overview
  navigation_contract_version: "1.1"
  expose_in_generated_ui: true
  preferred_view: overview
  version: 0.8.9

app_shell:
  standard: Home Assistant NikaS specialized panel
  version: 1.9
  header:
    menu:
      icon: mdi:menu
      action: hass-toggle-menu
      event_bubbles: true
      event_composed: true
      min_touch_target_px: 44
    title: Keenetic Hero 4G+
    title_surface_action: return_to_source_nikas_panel
    version_line: UI v0.8.9
    title_alignment: viewport_center
    source_route_handoff_key: nikas.specialized.source_route.v1
    source_route_timestamp_key: nikas.specialized.source_route_at.v1
    saved_return_route_key: nikas.keenetic.return_route.v1
    return_sources:
      - /dashboard-house-v11/home
      - /dashboard-actions/home
      - /dashboard-infrastructure/overview
    return_capture_precedence:
      - return_to
      - from
      - session_handoff
      - saved_route
      - same_origin_referrer
      - parent_route
      - safe_return_route
    browser_history_back_allowed: false
    show_brand_icon: false
    actions:
      - refresh
  bottom_navigation:
    fixed: true
    edge_attached: true
    full_width_mobile: true
    floating: false
    safe_area: true
    outside_scroll_region: true
    overlaps_content: false
    max_primary_items: 5
    items:
      - overview
      - wan
      - failover
      - traffic
      - diagnostics
  secondary_views:
    - system

frontend_delivery:
  mode: self_contained_bundle
  module: keenetic-panel-bundle.js
  web_component: keenetic-hero-app-panel-v089
  includes_styles: true
  cache_busting: query_panel_version
  runtime_previous_version_imports: false

view_patterns:
  overview:
    preserve_network_topology: true
    channel_selector: contextual_segmented
    items:
      - id: ethernet
        label: Провод
      - id: lte
        label: LTE
    default_selected_from_role: active_wan
    active_branch_indicator: true
    single_channel_detail_visible: true
    unknown_active_wan_has_no_fabricated_default: true
    device_selector: false
    device_control: false
  wan:
    selector: contextual_segmented
    items:
      - id: ethernet
        label: Провод
      - id: lte
        label: LTE
    single_detail_visible: true
    device_selector: false
  traffic:
    periods:
      - 24h
      - 7d
      - 30d
    refresh_on_each_selection: true
    stale_period_cache_must_not_suppress_reload: true
    late_response_must_not_replace_current_period_state: true
