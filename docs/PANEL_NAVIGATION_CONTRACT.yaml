panel:
  id: keenetic
  title: Keenetic
  path: /dashboard-keenetic
  icon: mdi:router-network
  owner: ha-keenetic-hero-4g
  parent_route: /dashboard-infrastructure/overview
  expose_in_generated_ui: true
  preferred_view: overview
  version: 0.2.4

app_shell:
  standard: Home Assistant NikaS specialized panel
  version: 1.1
  header:
    back:
      icon: mdi:arrow-left
      label: Назад
      navigate: /dashboard-infrastructure/overview
      use_browser_history: false
      min_touch_target_px: 44
    title: Keenetic Hero 4G+
    actions:
      - refresh
  bottom_navigation:
    fixed: true
    edge_attached: true
    full_width_mobile: true
    floating: false
    safe_area: true
    outside_scroll_region: true
    overlaps_content: false
    max_primary_items: 5
    items:
      - overview
      - wan
      - failover
      - traffic
      - diagnostics
  secondary_views:
    - system

view_patterns:
  overview:
    wan_quick_buttons: true
    reference: Stark SolarPower device selector
    items:
      - id: ethernet
        label: Провод
      - id: lte
        label: LTE
    active_from_role: active_wan
    active_branch_highlight: true
    device_control: false
    tap_action: open selected WAN/LTE detail
  wan:
    selector: segmented
    reference: Stark SolarPower device selector
    items:
      - id: ethernet
        label: Провод
      - id: lte
        label: LTE
    single_detail_visible: true
